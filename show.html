<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>The Plan — 美术效果还原 (three.js)</title>
<style>
  :root{
    --ink:#1b1f24; --ink-2:#5b6672; --line:rgba(20,26,34,.14);
    --panel:rgba(252,253,255,.90); --accent:#2f6feb; --accent-2:#0f9f7f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070a;
    font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  canvas{display:block}
  #app{position:fixed;inset:0}

  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 8px 28px rgba(8,14,24,.22);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px)}
  #hud{top:14px;left:14px;width:288px;max-height:calc(100% - 28px);overflow:auto;padding:14px 14px 16px}
  #hud h1{margin:0 0 2px;font-size:14px;letter-spacing:.02em}
  #hud .sub{color:var(--ink-2);font-size:11.5px;margin-bottom:12px;line-height:1.45}
  .grp{border-top:1px solid var(--line);padding:11px 0 4px}
  .grp:first-of-type{border-top:0;padding-top:2px}
  .grp>.t{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--ink-2);
    text-transform:uppercase;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row label{flex:0 0 92px;font-size:12px;color:var(--ink-2)}
  .row input[type=range]{flex:1;min-width:0;height:18px;accent-color:var(--accent)}
  .row .v{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;
    font-size:11.5px;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:12.5px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);width:14px;height:14px}
  select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:12.5px;color:var(--ink)}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  button{flex:1 1 auto;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  #stats{bottom:14px;left:14px;padding:10px 13px;font-size:11.5px;color:var(--ink-2);
    font-variant-numeric:tabular-nums;line-height:1.6}
  #stats b{color:var(--ink);font-weight:600}
  #keys{bottom:14px;right:14px;padding:10px 13px;font-size:11.5px;color:var(--ink-2);line-height:1.7}
  #keys kbd{background:#eef1f6;border:1px solid var(--line);border-radius:4px;
    padding:0 4px;font:11px/1.5 ui-monospace,monospace;color:var(--ink)}

  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:#05070a;z-index:9;color:#cfd8e3;font-size:13px}
  #load .bar{width:230px;height:3px;background:#1b2430;border-radius:2px;overflow:hidden}
  #load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  .hidden{display:none !important}
  #err{max-width:520px;padding:16px 18px;background:#fff;color:#111;border-radius:10px;font-size:12.5px;line-height:1.6}
  #err code{background:#f2f4f8;padding:1px 5px;border-radius:4px;font-family:ui-monospace,monospace}
  @media (max-width:760px){ #hud{width:246px} #keys{display:none} }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="panel">
  <h1>The Plan · 美术效果还原</h1>
  <div class="sub">单场景 / 全内嵌 / 贴图驱动 + 15 级渲染队列手工深度分层。</div>

  <div class="grp">
    <div class="t">视角</div>
    <select id="camPick"></select>
    <div class="btns">
      <button id="tourBtn">垂直巡游</button>
      <button id="resetBtn">回到预设</button>
    </div>
  </div>

  <div class="grp">
    <div class="t">镜头</div>
    <div class="row"><label>视场角</label><input id="fov" type="range" min="8" max="75" step="1"><span class="v" id="fovV"></span></div>
    <div class="row"><label>鼠标灵敏度</label><input id="sens" type="range" min="20" max="300" step="5"><span class="v" id="sensV"></span></div>
  </div>

  <div class="grp">
    <div class="t">后期</div>
    <label class="chk"><input id="ppOn" type="checkbox" checked> 启用后期链</label>
    <div class="row"><label>Bloom</label><input id="bloom" type="range" min="0" max="2" step="0.02"><span class="v" id="bloomV"></span></div>
    <div class="row"><label>Bloom 阈值</label><input id="bthr" type="range" min="0" max="1.4" step="0.01"><span class="v" id="bthrV"></span></div>
    <div class="row"><label>暗角</label><input id="vig" type="range" min="0" max="1" step="0.02"><span class="v" id="vigV"></span></div>
    <div class="row"><label>胶片颗粒</label><input id="grain" type="range" min="0" max="0.14" step="0.002"><span class="v" id="grainV"></span></div>
    <div class="row"><label>色差</label><input id="ca" type="range" min="0" max="2.5" step="0.05"><span class="v" id="caV"></span></div>
  </div>

  <div class="grp">
    <div class="t">着色还原</div>
    <label class="chk"><input id="waveOn" type="checkbox" checked> 风吹草叶（顶点位移）</label>
    <div class="row"><label>摇摆幅度</label><input id="waveAmp" type="range" min="0" max="1.6" step="0.02" value="0.5"><span class="v" id="waveAmpV"></span></div>
    <div class="row"><label>摇摆速度</label><input id="waveSpd" type="range" min="0" max="2.5" step="0.05"><span class="v" id="waveSpdV"></span></div>
    <div class="row"><label>光束流动</label><input id="scroll" type="range" min="0" max="3" step="0.05"><span class="v" id="scrollV"></span></div>
  </div>

  <div class="grp">
    <div class="t">光照 / 排序</div>
    <div class="row"><label>环境光</label><input id="amb" type="range" min="0" max="1.2" step="0.02"><span class="v" id="ambV"></span></div>
    <div class="row"><label>点光源</label><input id="plI" type="range" min="0" max="12" step="0.1"><span class="v" id="plIV"></span></div>
    <label class="chk"><input id="sortByQueue" type="checkbox" checked> 按 Unity 渲染队列排序</label>
    <label class="chk"><input id="wire" type="checkbox"> 线框</label>
    <div class="btns"><button id="shotBtn">保存截图</button></div>
  </div>
</div>

<div id="stats" class="panel"></div>
<div id="keys" class="panel">
  <kbd>左键拖拽</kbd> 旋转 · <kbd>右键/中键</kbd> 平移<br>
  <kbd>滚轮</kbd> 推拉 · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>Q</kbd><kbd>E</kbd> 位移<br>
  <kbd>Shift</kbd> 加速 · <kbd>空格</kbd> 自动巡游
</div>

<div id="load">
  <div>正在装载 The Plan 的原始资产…</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg" style="font-size:11.5px;opacity:.6"></div>
</div>

<script src="lib/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
